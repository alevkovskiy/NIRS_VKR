name: Aurora client RPM
run-name: ${{ inputs.portal_request_id && format('NIRS {0}', inputs.portal_request_id) || 'Aurora client RPM' }}
on:
  workflow_dispatch:
    inputs:
      portal_request_id:
        description: Portal request ID
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check client contract
        run: node aurora_client/tests/contract.test.cjs
      - name: Build and validate RPM
        run: bash scripts/build-aurora-bt.sh
        env:
          AURORA_ARCH: arm64
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/rpm
      - name: Publish RPM
        uses: actions/upload-artifact@v4
        with:
          name: aurora-rpm
          path: artifacts/rpm/*.rpm
          if-no-files-found: error
          retention-days: 3
      - name: Publish build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-build-log
          path: artifacts/rpm/build.log
          if-no-files-found: ignore
          retention-days: 3
