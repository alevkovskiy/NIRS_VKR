name: Portal CI
run-name: ${{ inputs.portal_request_id && format('NIRS {0}', inputs.portal_request_id) || format('Portal CI — {0}', github.ref_name) }}
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      portal_request_id:
        description: Portal request ID (leave blank for a manual check)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: portal-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.portal_request_id || github.event_name }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nirs_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: nirs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U nirs_test -d nirs_test"
          --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://nirs_test:ci_only_password@127.0.0.1:5432/nirs_test
      TEST_DATABASE_URL: postgresql+psycopg://nirs_test:ci_only_password@127.0.0.1:5432/nirs_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --locked
      - name: Verify migrations
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
          uv run --no-sync alembic downgrade base
          uv run --no-sync alembic upgrade head
      - name: Check server
        run: |
          uv run --no-sync ruff check config.py database.py security.py manage.py models schemas main.py routers services crud migrations tests
          uv run --no-sync pytest -q --junitxml=artifacts/tests.xml
      - name: Check client contract and scripts
        run: |
          node aurora_client/tests/contract.test.cjs
          node --check static/js/app.js
          node --check static/js/api.js
          bash -n scripts/build-aurora.sh scripts/deploy.sh
      - name: Build portal image
        run: docker build -t nirs-portal:${{ github.sha }} .
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: artifacts/tests.xml
          if-no-files-found: ignore
          retention-days: 3
