[project]
name = "nirs"
version = "0.1.0"
description = "Portal for mobile client build runs and AI-assisted diagnostics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.2",
    "pytest>=9.2.0",
    "httpx>=0.28.1",
]

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
